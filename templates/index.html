<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sulekha Silks | Royalty Reimagined</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Tenor+Sans&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --burgundy: #600018; --ivory: #FCF9F2; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: var(--ivory); font-family: 'Tenor Sans', sans-serif; overflow-x: hidden; }
        
        /* Premium Header */
        nav {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 5%; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid var(--gold);
        }
        .logo-box { display: flex; align-items: center; text-decoration: none; }
        .logo-box img { height: 50px; border-radius: 5px; margin-right: 10px; }
        
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { text-decoration: none; color: #333; font-size: 0.8rem; letter-spacing: 1px; font-weight: bold; }

        /* User Profile Badge */
        .profile-badge {
            background: var(--burgundy); color: white; padding: 5px 15px;
            border-radius: 20px; font-size: 0.7rem; display: flex; align-items: center; gap: 8px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .nav-links { display: none; } /* Mobile-ൽ മെനു ബട്ടൺ വേണം, ഇതിനായി പിന്നീട് JS ചേർക്കാം */
            .logo-text { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo-box">
            <img src="{{ url_for('static', filename='sulekha.jpg') }}" alt="Logo">
            <span style="font-family: 'Cinzel'; color: var(--burgundy); font-weight: 900;">SULEKHA SILKS</span>
        </a>
        <div class="nav-links">
            <a href="/">HOME</a>
            <a href="/shop">COLLECTION</a>
            <a href="/gallery">GALLERY</a>
            <a href="/about">ABOUT US</a>
            {% if session.user_name %}
                <a href="/profile" class="profile-badge">👑 {{ session.user_name }}</a>
                <a href="/logout" style="color: red;">LOGOUT</a>
            {% else %}
                <a href="/login" style="background: var(--gold); color: white; padding: 8px 15px; border-radius: 5px;">LOGIN</a>
            {% endif %}
        </div>
    </nav>

    {% block content %}{% endblock %}

    <footer style="background: #1a1a1a; color: var(--gold); padding: 50px; text-align: center; margin-top: 50px;">
        <h2 style="font-family: 'Cinzel';">SULEKHA SILKS</h2>
        <p>Legacy of Elegance since 1978</p>
    </footer>
</body>
</html>
