{% extends "base.html" %}
{% block content %}

<section class="hero-slider">
    <div class="hero-image"></div>
    <div class="hero-content">
        <h3 style="letter-spacing: 5px;">THE WEDDING REGISTRY</h3>
        <h1 style="font-family: 'Cinzel'; font-size: 4.5rem;">Sulekha <span>Couture</span></h1>
        <a href="#collection" class="btn-gold">EXPLORE COLLECTION</a>
    </div>
</section>

<div class="filter-bar" style="padding: 20px 5%; background: white; display: flex; gap: 20px; border-bottom: 1px solid #eee;">
    <select><option>Saree Type</option><option>Kanchipuram</option><option>Banarasi</option></select>
    <select><option>Price Range</option><option>Under ₹5000</option><option>Above ₹10000</option></select>
</div>

<div class="product-grid" id="collection">
    <div class="saree-card">
        <div class="badge">BEST SELLER</div>
        <img src="https://images.pexels.com/photos/15712165/pexels-photo-15712165.jpeg" alt="Model Saree">
        <div style="padding: 20px;">
            <h4 style="font-family: 'Cinzel';">Vermillion Bridal Weave</h4>
            <p style="color: var(--gold); font-weight: bold; margin-top: 5px;">₹18,500</p>
            <button class="add-cart">ADD TO BAG</button>
        </div>
    </div>

    <div class="saree-card">
        <img src="https://images.pexels.com/photos/14624458/pexels-photo-14624458.jpeg" alt="Model Saree">
        <div style="padding: 20px;">
            <h4 style="font-family: 'Cinzel';">Golden Zari Kasavu</h4>
            <p style="color: var(--gold); font-weight: bold; margin-top: 5px;">₹7,200</p>
            <button class="add-cart">ADD TO BAG</button>
        </div>
    </div>

    <div class="saree-card">
        <div class="badge">NEW</div>
        <img src="https://images.pexels.com/photos/11050215/pexels-photo-11050215.jpeg" alt="Model Saree">
        <div style="padding: 20px;">
            <h4 style="font-family: 'Cinzel';">Midnight Silk Designer</h4>
            <p style="color: var(--gold); font-weight: bold; margin-top: 5px;">₹12,999</p>
            <button class="add-cart">ADD TO BAG</button>
        </div>
    </div>
</div>

{% endblock %}
