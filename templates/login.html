<div class="auth-container" style="display: flex; height: 100vh;">
    <div style="flex: 1; background: url('https://images.unsplash.com/photo-1583391733956-6c78276477e2') center/cover;"></div>
    
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; background: white;">
        <form style="width: 350px;">
            <h2 style="font-family: 'Cinzel'; text-align: center; margin-bottom: 30px;">Member Login</h2>
            <input type="email" placeholder="Email Address" style="width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ddd;">
            <input type="password" placeholder="Password" style="width: 100%; padding: 15px; margin-bottom: 20px; border: 1px solid #ddd;">
            <button type="submit" style="width: 100%; padding: 15px; background: var(--burgundy); color: white; border: none; letter-spacing: 2px;">SIGN IN</button>
            <p style="text-align: center; margin-top: 20px; font-size: 0.8rem;">New here? <a href="/signup" style="color: var(--gold);">Create Account</a></p>
        </form>
    </div>
</div>
