{% extends "base.html" %}
{% block content %}
<div style="max-width: 600px; margin: 100px auto; background: white; padding: 40px; border: 1px solid var(--gold); text-align: center;">
    <div style="width: 100px; height: 100px; background: var(--gold); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem;">
        {{ session.user_name[0] }}
    </div>
    <h2>Welcome, {{ session.user_name }}</h2>
    <p style="color: #666; margin-top: 10px;">Exclusive Member since 2026</p>
    <hr style="margin: 20px 0; border: 0.5px solid #eee;">
    <div style="text-align: left;">
        <p><strong>Recent Orders:</strong> No orders yet.</p>
        <p><strong>Membership Status:</strong> Premium Gold</p>
    </div>
    <a href="/logout" style="display: inline-block; margin-top: 30px; color: var(--burgundy); font-weight: bold;">Logout</a>
</div>
{% endblock %}
